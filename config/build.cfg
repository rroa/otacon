# ============================================================================
#  Canabalt C++  —  build configuration
#  This file is parsed by CMake at configure time (see cmake/ReadBuildCfg.cmake).
#  Change a value, re-run CMake, and the engine is compiled with that choice.
# ============================================================================

# Which graphics backend to compile in.
#   GL_LEGACY  -> OpenGL fixed-function pipeline (glBegin/glEnd, glOrtho)
#   GL_MODERN  -> OpenGL core profile with shaders + VBO/VAO (default)
#   VULKAN     -> Vulkan (needs the Vulkan SDK / MoltenVK; on macOS launch via
#                 tools/run.sh so the loader is found)
GRAPHICS_BACKEND = GL_MODERN

# Windowing / context / input backend. Kept behind platform::IWindow so it has
# minimal incidence on the rest of the engine; swap freely.
#   GLFW  -> GLFW 3.4 (default; lean, great GL + Vulkan support)
#   SDL2  -> SDL2 (alternative; same IWindow interface)
WINDOW_BACKEND = GLFW

# Scalar type used by the in-house math + simulation.
#   FLOAT  -> 32-bit IEEE float (matches the original game exactly; default)
#   FIXED  -> Q16.16 fixed-point (teaching/perf demonstration; see docs)
SCALAR_TYPE = FLOAT

# Enable the in-house memory manager's allocation tracking / leak report.
MEMORY_TRACKING = ON

# Build the debug runtime (runtime view switching, collision-box overlays, HUD).
DEBUG_RUNTIME = ON
